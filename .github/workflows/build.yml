name: Build JoyConPlusPlus

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSVC environment
      uses: ilammy/msvc-dev-cmd@v1
      # toolset なしでデフォルト

    - name: Install latest CMake
      uses: lukka/get-cmake@v3.30.5

    - name: Setup vcpkg and install hidapi
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgDirectory: ${{ runner.workspace }}/vcpkg
        runVcpkgInstall: true
        vcpkgJsonGlob: '**/vcpkg.json'  # vcpkg.jsonをルートに置く場合

    - name: Configure CMake
      run: |
        cmake -S . -B build ^
          -DCMAKE_BUILD_TYPE=Release ^
          -DCMAKE_TOOLCHAIN_FILE=${{ runner.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake ^
          -DVCPKG_TARGET_TRIPLET=x64-windows ^
          -DCMAKE_CXX_FLAGS="/MP" ^
          -DCMAKE_VERBOSE_MAKEFILE=ON

    - name: Build project
      run: cmake --build build --config Release --parallel 4

    - name: Upload build artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: JoyConPlusPlus-build-artifacts
        path: |
          build/**/*
        if-no-files-found: warn
