name: Build JoyConPlusPlus

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 大工さんに「道具箱」を開けさせるステップ
      - name: Setup Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Compile JoyConPlusPlus
        shell: cmd
        # これで cl.exe が見つかるようになります
        run: |
          cl.exe /EHsc /O2 *.cpp /Fe:JoyConPlusPlus.exe

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: JoyConPlusPlus-Exe
          path: ./*.exe
