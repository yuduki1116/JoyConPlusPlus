name: Build JoyConPlusPlus

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        # ここを「どこに隠れていても見つける」命令に変えました
        run: |
          $sln = Get-ChildItem -Recurse -Filter *.sln | Select-Object -ExpandProperty FullName -First 1
          nuget restore "$sln"

      - name: Build with MSBuild
        # ここも「どこに隠れていても見つける」命令です
        run: |
          $sln = Get-ChildItem -Recurse -Filter *.sln | Select-Object -ExpandProperty FullName -First 1
          msbuild "$sln" /p:Configuration=Release /p:Platform=x64

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: JoyConPlusPlus-Exe
          path: |
            **/bin/Release/
            **/x64/Release/
            **/*.exe
