name: Build JoyConPlusPlus

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 1. 道具（HIDAPI）をインストール
      - name: Install HIDAPI via vcpkg
        run: vcpkg install hidapi:x64-windows

      - name: Setup Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Compile JoyConPlusPlus
        shell: cmd
        # 2. VCPKG_INSTALLATION_ROOT という魔法の言葉を使って場所を教えます
        run: |
          cl.exe /EHsc /O2 /std:c++17 ^
          -I"%VCPKG_INSTALLATION_ROOT%\installed\x64-windows\include" ^
          JoyCon++.cpp src/*.cpp /Fe:JoyConPlusPlus.exe ^
          /link /LIBPATH:"%VCPKG_INSTALLATION_ROOT%\installed\x64-windows\lib" ^
          hidapi.lib windowsapp.lib Advapi32.lib User32.lib Ole32.lib Shell32.lib runtimeobject.lib Bthprops.lib

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: JoyConPlusPlus-Exe
          path: ./*.exe
