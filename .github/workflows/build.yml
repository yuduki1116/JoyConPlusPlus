name: Build JoyConPlusPlus

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install HIDAPI
        run: vcpkg install hidapi:x64-windows

      - name: Setup Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: 🚀 Ultra-Complex Dynamic Build
        shell: pwsh
        run: |
          echo "--- 🔍 HIDAPIの捜索を開始します ---"
          # システム全体から hidapi.h を探す（一番確実な場所を特定）
          $found = Get-ChildItem -Path C:\ -Filter "hidapi.h" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          
          if ($null -eq $found) {
              Write-Error "❌ サーバーのどこにも hidapi.h が存在しません。vcpkgのインストールに失敗しています。"
              exit 1
          }

          $INC_PATH = $found.DirectoryName
          # include から lib のパスを推測 (../../lib または ../lib)
          $BASE_PATH = $INC_PATH.Substring(0, $INC_PATH.LastIndexOf("\include"))
          $LIB_PATH = "$BASE_PATH\lib"

          echo "✅ 発見: $INC_PATH"
          echo "📂 LIBパス: $LIB_PATH"

          echo "--- 🔨 コンパイルを実行します ---"
          # 動的に特定したパスを cl.exe に流し込む
          & cl.exe /EHsc /O2 /std:c++17 /W3 /utf-8 `
            -I"$INC_PATH" `
            JoyCon++.cpp src/*.cpp /Fe:JoyConPlusPlus.exe `
            /link /LIBPATH:"$LIB_PATH" `
            hidapi.lib windowsapp.lib Advapi32.lib User32.lib Ole32.lib Shell32.lib runtimeobject.lib Bthprops.lib

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          echo "🎉 ビルド成功！"

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: JoyConPlusPlus-Exe
          path: ./*.exe
