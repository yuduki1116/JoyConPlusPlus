name: Build JoyConPlusPlus

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 1. vcpkgを「マニフェストモード」で準備
      - name: Install HIDAPI
        run: vcpkg install hidapi:x64-windows

      - name: Setup Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Compile JoyConPlusPlus
        shell: cmd
        # ポイント：vcpkgの「integrate install」という機能を使って、
        # コンパイラが自動的に include フォルダを見つけるように仕向けます。
        run: |
          vcpkg integrate install
          cl.exe /EHsc /O2 /std:c++17 ^
          JoyCon++.cpp src/*.cpp /Fe:JoyConPlusPlus.exe ^
          /link /LIBPATH:"C:/vcpkg/installed/x64-windows/lib" ^
          hidapi.lib windowsapp.lib Advapi32.lib User32.lib Ole32.lib Shell32.lib runtimeobject.lib Bthprops.lib

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: JoyConPlusPlus-Exe
          path: ./*.exe
