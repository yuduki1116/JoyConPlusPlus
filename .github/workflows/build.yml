name: Build JoyConPlusPlus

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install HIDAPI
        run: vcpkg install hidapi:x64-windows

      - name: Setup Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: 🚀 Hyper-Robust Build (Case-Insensitive Search)
        shell: pwsh
        run: |
          echo "--- 🔍 HIDAPIの捜索を再開します (大文字小文字無視モード) ---"
          # hidapi.h を再帰的に検索
          $foundFile = Get-ChildItem -Path C:\ -Filter "hidapi.h" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          
          if ($null -eq $foundFile) {
              Write-Error "❌ hidapi.h がサーバー内に存在しません。"; exit 1
          }

          # フォルダパスを取得
          $INC_PATH = $foundFile.DirectoryName
          echo "✅ インクルードパス発見: $INC_PATH"

          # libパスを動的に生成 (includeの親フォルダにある lib を探す)
          $parent = Split-Path -Parent $INC_PATH
          $LIB_PATH = Join-Path $parent "lib"
          
          if (-not (Test-Path $LIB_PATH)) {
              # もし include/hidapi.h の形なら
              $LIB_PATH = Join-Path (Split-Path -Parent $parent) "lib"
          }
          echo "📂 LIBパス確定: $LIB_PATH"

          echo "--- 🔨 コンパイルを実行します ---"
          # cl.exe に全ての情報を叩き込む
          & cl.exe /EHsc /O2 /std:c++17 /W3 /utf-8 `
            -I"$INC_PATH" `
            JoyCon++.cpp src/*.cpp /Fe:JoyConPlusPlus.exe `
            /link /LIBPATH:"$LIB_PATH" `
            hidapi.lib windowsapp.lib Advapi32.lib User32.lib Ole32.lib Shell32.lib runtimeobject.lib Bthprops.lib

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          echo "🎉 ついにビルドに成功しました！"

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: JoyConPlusPlus-Exe
          path: ./*.exe
