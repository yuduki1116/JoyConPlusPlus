name: Build JoyConPlusPlus

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install HIDAPI via vcpkg
        # vcpkg.jsonを使わず、直接x64版をインストールします
        run: vcpkg install hidapi:x64-windows

      - name: Setup Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Compile JoyConPlusPlus
        shell: cmd
        # ポイント：$VCPKG_INSTALLATION_ROOT ではなく、カレントディレクトリの「vcpkg_installed」を見に行きます
        run: |
          cl.exe /EHsc /O2 /std:c++17 ^
          -I"vcpkg_installed/x64-windows/include" ^
          JoyCon++.cpp src/*.cpp /Fe:JoyConPlusPlus.exe ^
          /link /LIBPATH:"vcpkg_installed/x64-windows/lib" ^
          hidapi.lib windowsapp.lib Advapi32.lib User32.lib Ole32.lib Shell32.lib runtimeobject.lib Bthprops.lib

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: JoyConPlusPlus-Exe
          path: ./*.exe
