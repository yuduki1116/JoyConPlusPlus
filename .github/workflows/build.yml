name: Build JoyConPlusPlus

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 1. GitHub公式の方法でvcpkgとHIDAPIをセットアップ
      - name: Setup vcpkg
        run: vcpkg install hidapi:x64-windows

      - name: Setup Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Compile JoyConPlusPlus
        shell: cmd
        # 2. 変数を使わず、GitHub環境の絶対パスを直接指定して確実に認識させます
        run: |
          cl.exe /EHsc /O2 /std:c++17 ^
          -I"D:/a/JoyConPlusPlus/JoyConPlusPlus/vcpkg_installed/x64-windows/include" ^
          JoyCon++.cpp src/*.cpp /Fe:JoyConPlusPlus.exe ^
          /link /LIBPATH:"D:/a/JoyConPlusPlus/JoyConPlusPlus/vcpkg_installed/x64-windows/lib" ^
          hidapi.lib windowsapp.lib Advapi32.lib User32.lib Ole32.lib Shell32.lib runtimeobject.lib Bthprops.lib

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: JoyConPlusPlus-Exe
          path: ./*.exe
