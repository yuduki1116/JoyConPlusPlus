name: Build JoyConPlusPlus

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Find and Build
        shell: pwsh
        run: |
          # 全フォルダから .sln を本気で探す
          $slnFile = Get-ChildItem -Recurse -Filter *.sln | Select-Object -First 1
          
          if ($null -eq $slnFile) {
            Write-Error "設計図 (.sln) がどこにも見つかりませんでした！リポジトリの中身が空っぽかもしれません。"
            exit 1
          }
          
          Write-Host "設計図を発見しました: $($slnFile.FullName)"
          
          # 復元とビルドを一気に実行
          nuget restore "$($slnFile.FullName)"
          msbuild "$($slnFile.FullName)" /p:Configuration=Release /p:Platform=x64

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: JoyConPlusPlus-Exe
          path: |
            **/bin/Release/**/*.exe
            **/x64/Release/**/*.exe
            **/*.exe
