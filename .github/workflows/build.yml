name: Build JoyConPlusPlus

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup MSVC Dev Cmd
      uses: ilammy/msvc-dev-cmd@v1
      with:
        toolset: 14.4x   # 2022最新

    - name: Install latest CMake
      uses: lukka/get-cmake@v3.30.5

    # ── ここが大事！ vcpkgでhidapiだけサクッと入れる ──
    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgDirectory: ${{ runner.workspace }}/vcpkg
        vcpkgGitCommitId: 'master'   # 最新でOK（hidapiは安定してる）
        vcpkgArguments: hidapi:x64-windows

    - name: Configure CMake with vcpkg toolchain
      run: |
        cmake -S . -B build ^
          -DCMAKE_BUILD_TYPE=Release ^
          -DCMAKE_TOOLCHAIN_FILE=${{ runner.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake ^
          -DVCPKG_TARGET_TRIPLET=x64-windows ^
          -DCMAKE_CXX_FLAGS="/MP"

    - name: Build
      run: cmake --build build --config Release --parallel 4

    - name: Upload artifacts (optional)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: JoyConPlusPlus-build
        path: build/**/*
